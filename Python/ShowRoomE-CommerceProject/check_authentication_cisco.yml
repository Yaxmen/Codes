---
# Cisco ASA / IOS / IOS-XE - autenticação via network_cli
# Executar somente depois de DNS e TCP bem-sucedidos.
- name: Cisco | Inicializar resultado de autenticação
  ansible.builtin.set_fact:
    check_result:
      id: authentication
      status: FAILED
      reason: AUTHENTICATION_FAILED
      details:
        authentication_status: FAILED

- name: Cisco | Verificar autenticação e sessão CLI
  block:
    - name: Cisco | Consultar versão no ASA
      cisco.asa.asa_command:
        commands:
          - show version
      register: cisco_auth_probe
      changed_when: false
      when: ansible_network_os == 'cisco.asa.asa'

    - name: Cisco | Consultar versão no IOS/IOS-XE
      cisco.ios.ios_command:
        commands:
          - show version
      register: cisco_auth_probe
      changed_when: false
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Cisco | Registrar autenticação validada
      ansible.builtin.set_fact:
        check_result:
          id: authentication
          status: SUCCESS
          reason: ''
          details:
            authentication_status: SUCCESS
            platform: "{{ ansible_network_os }}"
      when:
        - ansible_network_os in ['cisco.asa.asa', 'cisco.ios.ios']
        - cisco_auth_probe is defined
        - not (cisco_auth_probe.skipped | default(false))

  rescue:
    - name: Cisco | Registrar falha de sessão ou autenticação
      ansible.builtin.set_fact:
        check_result:
          id: authentication
          status: FAILED
          reason: AUTHENTICATION_OR_CLI_FAILED
          details:
            authentication_status: FAILED
            platform: "{{ ansible_network_os | default('UNKNOWN') }}"
            error: "{{ ansible_failed_result.msg | default('Falha na sessão CLI') }}"
